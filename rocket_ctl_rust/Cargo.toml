[package]
name = "rocket_ctl_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "rocket_ctl_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
crc = "3.0"
tokio = { version = "1.47", features = ["full"] }
parking_lot = "0.13.0"
