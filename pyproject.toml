[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "rocket_ctl_rust"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "nicegui>=1.4.0",
    "pyyaml",
]

[tool.maturin]
manifest-path = "rocket_ctl_rust/Cargo.toml"
features = ["pyo3/extension-module"]
